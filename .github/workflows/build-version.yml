name: Build version

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install static build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip gdb
          python3 -m pip --disable-pip-version-check install --target "$RUNNER_TEMP/zig" ziglang==0.15.2
          echo "$RUNNER_TEMP/zig/ziglang" >> "$GITHUB_PATH"
      - name: Build release binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          cargo build --locked --release --bins --target "$TARGET"
      - name: Verify offline scripting on a real core
        timeout-minutes: 5
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          c++ -O0 -g -pthread -fno-omit-frame-pointer -Wl,--build-id tests/script_fixture.cc -o "$RUNNER_TEMP/script-fixture"
          c++ -O0 -g -pthread -fno-omit-frame-pointer -Wl,--build-id -DFIXTURE_VALUE=41 tests/script_fixture.cc -o "$RUNNER_TEMP/script-wrong"
          python3 tests/scripts.py "target/$TARGET/release/aidbg" "target/$TARGET/release/aidbg-server" \
            "$RUNNER_TEMP/script-fixture" "$RUNNER_TEMP/script-wrong"
      - name: Verify retained core workflow without helper executables
        timeout-minutes: 5
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Exercise a copied instruction and read-only data on the same page.
          cc -O0 -g -fno-omit-frame-pointer -Wl,--build-id,-z,noseparate-code tests/debug-cases/cases/D01.c -pthread -o "$RUNNER_TEMP/D01"
          cc -O0 -g -Wl,--build-id tests/run_target_fixture.c -pthread -o "$RUNNER_TEMP/run-target"
          python3 tests/core_workflow.py "target/$TARGET/release/aidbg" "target/$TARGET/release/aidbg-server" \
            "$RUNNER_TEMP/D01" "$RUNNER_TEMP/run-target"
      - name: Verify ELF and package binaries
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd "target/$TARGET/release"
          for bin in aidbg aidbg-server; do
            file "$bin"
            if readelf -lW "$bin" | grep 'INTERP' >/dev/null; then exit 1; fi
            if readelf -dW "$bin" | grep '(NEEDED)' >/dev/null; then exit 1; fi
            case "$ARCH" in
              x86_64) readelf -hW "$bin" | grep 'X86-64' ;;
              aarch64) readelf -hW "$bin" | grep 'AArch64' ;;
              *) exit 1 ;;
            esac
          done
          tar -czf "$GITHUB_WORKSPACE/aidbg-$GITHUB_REF_NAME-linux-$ARCH.tar.gz" aidbg aidbg-server
      - uses: actions/upload-artifact@v4
        with:
          name: aidbg-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: aidbg-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aidbg-${{ github.ref_name }}-linux-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "dist/aidbg-$GITHUB_REF_NAME-linux-x86_64.tar.gz" \
            "dist/aidbg-$GITHUB_REF_NAME-linux-aarch64.tar.gz"
