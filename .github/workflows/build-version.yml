name: Build version

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            package_arch: x86_64
            features: ''
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            package_arch: aarch64-plain-ptrs
            features: plain-ptrs
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            package_arch: aarch64-compressed-ptrs
            features: ''
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install static build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip clang
          python3 -m pip --disable-pip-version-check install --target "$RUNNER_TEMP/zig" ziglang==0.15.2
          echo "$RUNNER_TEMP/zig/ziglang" >> "$GITHUB_PATH"
      - name: Build release binaries
        id: build
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          cargo build --locked --release --bins --target "$TARGET" --features "$FEATURES"
      - name: Verify the MCP session
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          gcc -O0 -g -gdwarf-4 -pthread tests/session_fixture.c -ldl -o "$RUNNER_TEMP/gcc-fixture"
          clang -O0 -g -gdwarf-5 -pthread tests/session_fixture.c -ldl -o "$RUNNER_TEMP/clang-fixture"
          gcc -O0 -fno-pic -c tests/session_link.c -o "$RUNNER_TEMP/link.o"
          gcc -O0 -g -shared -fPIC tests/session_link.c -o "$RUNNER_TEMP/session-test.so"
          make -C tests/debug-cases OUT="$RUNNER_TEMP/cases" "$RUNNER_TEMP/cases"/{D05,D06,D08,D09,D10}
          python3 tests/session.py "target/$TARGET/release/aidbg" "target/$TARGET/release/aidbg-server" \
            "$RUNNER_TEMP/gcc-fixture" "$RUNNER_TEMP/clang-fixture" --object "$RUNNER_TEMP/link.o" \
            --cases "$RUNNER_TEMP/cases" --library "$RUNNER_TEMP/session-test.so"
      - name: Verify ELF and package binaries
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          set -euo pipefail
          cd "target/$TARGET/release"
          for role in client server; do
            case "$role" in
              client) bin=aidbg ;;
              server) bin=aidbg-server ;;
            esac
            file "$bin"
            if readelf -lW "$bin" | grep 'INTERP' >/dev/null; then exit 1; fi
            if readelf -dW "$bin" | grep '(NEEDED)' >/dev/null; then exit 1; fi
            case "$ARCH" in
              x86_64) readelf -hW "$bin" | grep 'X86-64' ;;
              aarch64) readelf -hW "$bin" | grep 'AArch64' ;;
              *) exit 1 ;;
            esac
            tar -czf "$GITHUB_WORKSPACE/aidbg-$role-$GITHUB_REF_NAME-linux-$PACKAGE_ARCH.tar.gz" "$bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aidbg-${{ github.ref_name }}-linux-${{ matrix.package_arch }}
          path: aidbg-*-${{ github.ref_name }}-linux-${{ matrix.package_arch }}.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build and package Windows x64 client
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $target = 'x86_64-pc-windows-msvc'
          rustup target add $target
          cargo build --locked --release --bin aidbg --target $target
          $client = "target/$target/release/aidbg.exe"
          & $client --version
          Compress-Archive -LiteralPath $client -DestinationPath "aidbg-client-${env:GITHUB_REF_NAME}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: aidbg-${{ github.ref_name }}-windows-x86_64
          path: aidbg-client-${{ github.ref_name }}-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aidbg-${{ github.ref_name }}-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=("dist/aidbg-client-$GITHUB_REF_NAME-windows-x86_64.zip")
          for arch in x86_64 aarch64-plain-ptrs aarch64-compressed-ptrs; do
            for role in client server; do
              assets+=("dist/aidbg-$role-$GITHUB_REF_NAME-linux-$arch.tar.gz")
            done
          done
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}"
