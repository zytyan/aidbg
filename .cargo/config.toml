[env]
CC_aarch64_unknown_linux_musl = { value = "build/aarch64-musl-cc", relative = true }
CC_x86_64_unknown_linux_musl = { value = "build/x86_64-musl-cc", relative = true }

[target.aarch64-unknown-linux-musl]
linker = "build/aarch64-musl-cc"
rustflags = ["-C", "link-self-contained=no"]

[target.x86_64-unknown-linux-musl]
linker = "build/x86_64-musl-cc"
rustflags = ["-C", "link-self-contained=no"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
