syntax = "proto3";

package aidbg;

service Debugger {
  rpc ServerInfo (ServerInfoRequest) returns (DocumentReply);
  rpc ScriptApi (ScriptDocumentRequest) returns (DocumentReply);
  rpc ScriptCheck (ScriptDocumentRequest) returns (DocumentReply);
  rpc ScriptRun (ScriptDocumentRequest) returns (DocumentReply);
  rpc RunTarget (ScriptDocumentRequest) returns (DocumentReply);
  rpc RunStatus (ScriptDocumentRequest) returns (DocumentReply);
  rpc RunList (ScriptDocumentRequest) returns (DocumentReply);
  rpc RunPause (ScriptDocumentRequest) returns (DocumentReply);
  rpc RunContinue (ScriptDocumentRequest) returns (DocumentReply);
  rpc RunCancel (ScriptDocumentRequest) returns (DocumentReply);
  rpc CoreOpen (ScriptDocumentRequest) returns (DocumentReply);
  rpc CoreClose (ScriptDocumentRequest) returns (DocumentReply);
  rpc SearchMemory (SearchMemoryRequest) returns (DocumentReply);
  rpc ReadMemory (ReadMemoryRequest) returns (DocumentReply);
  rpc ObserveThreads (ScriptDocumentRequest) returns (DocumentReply);
  rpc PointerChain (PointerChainRequest) returns (DocumentReply);
  rpc Snapshot (SnapshotRequest) returns (SnapshotReply);
  rpc QuerySnapshot (QuerySnapshotRequest) returns (SnapshotReply);
  rpc Coredump (CoredumpRequest) returns (stream CoredumpChunk);
  rpc StartCoredump (StartCoredumpRequest) returns (CoredumpJob);
  rpc GetCoredump (GetCoredumpRequest) returns (CoredumpJob);
  rpc DownloadCoredump (DownloadCoredumpRequest) returns (stream CoredumpChunk);
  rpc RetainCoredump (RetainCoredumpRequest) returns (CoredumpJob);
  rpc UploadArtifact (stream ArtifactChunk) returns (DocumentReply);
  rpc DownloadCoreImages (ScriptDocumentRequest) returns (stream CoredumpChunk);
  rpc RuleDefine (ScriptDocumentRequest) returns (DocumentReply);
  rpc RuleList (ScriptDocumentRequest) returns (DocumentReply);
  rpc RuleUpdate (ScriptDocumentRequest) returns (DocumentReply);
  rpc RuleRemove (ScriptDocumentRequest) returns (DocumentReply);
  rpc InstallBreakpoint (InstallBreakpointRequest) returns (DocumentReply);
  rpc UpdateBreakpoint (UpdateBreakpointRequest) returns (DocumentReply);
  rpc RemoveBreakpoint (RemoveBreakpointRequest) returns (DocumentReply);
  rpc BreakpointEvents (BreakpointEventsRequest) returns (DocumentReply);
  rpc BreakpointList (BreakpointCapabilitiesRequest) returns (DocumentReply);
  rpc SearchSymbols (SearchSymbolsRequest) returns (DocumentReply);
  rpc ResolveAddress (ResolveAddressRequest) returns (DocumentReply);
  rpc Disassemble (DisassembleRequest) returns (DocumentReply);
  rpc BreakpointCapabilities (BreakpointCapabilitiesRequest) returns (DocumentReply);
  rpc Profile (ProfileRequest) returns (DocumentReply);
  rpc SymbolOverride (SymbolOverrideRequest) returns (DocumentReply);
  rpc Inspect (InspectRequest) returns (DocumentReply);
  rpc Assemble (AssembleRequest) returns (DocumentReply);
  rpc PlanPatch (PatchRequest) returns (DocumentReply);
  rpc Emulate (EmulateRequest) returns (DocumentReply);
  rpc StepWatch (StepWatchRequest) returns (DocumentReply);
  rpc StepRun (StepRunRequest) returns (DocumentReply);
  rpc TargetCall (TargetCallRequest) returns (DocumentReply);
}

message RetainCoredumpRequest {
  string dump_id = 1;
  uint64 retention_secs = 2;
}

message ArtifactHeader {
  enum Kind {
    CORE = 0;
    EXECUTABLE = 1;
    DEBUG_SYMBOLS = 2;
  }
  Kind kind = 1;
  uint64 size = 2;
}

message ArtifactChunk {
  oneof part {
    ArtifactHeader header = 1;
    bytes data = 2;
  }
}

message StepRunRequest {
  string run_id = 1;
  optional int32 tid = 2;
  optional uint32 max_steps = 3;
  optional uint32 timeout_ms = 4;
  enum Mode {
    STEP = 0;
    NEXT = 1;
    OUT = 2;
  }
  Mode mode = 5;
}

message ReadMemoryRequest {
  optional string target_id = 1;
  optional int32 pid = 2;
  optional string run_id = 3;
  uint64 address = 4;
  uint32 length = 5;
}

// Script requests share the JSON schema used by CLI and MCP.
message ServerInfoRequest {}

message ScriptDocumentRequest {
  bytes json = 1;
}

message StepWatchRequest {
  int32 pid = 1;
  optional int32 tid = 2;
  uint64 address = 3;
  uint32 length = 4;
  uint64 pc_start = 5;
  uint64 pc_end = 6;
  optional uint32 max_steps = 7;
  optional uint32 timeout_ms = 8;
}

message TargetCallRequest {
  int32 pid = 1;
  optional int32 tid = 2;
  string module = 3;
  string symbol = 4;
  optional uint64 instance = 5;
  repeated string arguments = 6;
  string return_type = 7;
  uint64 scratch_address = 8;
  uint32 scratch_length = 9;
  optional uint32 max_steps = 10;
  optional uint32 timeout_ms = 11;
  bool allow_side_effects = 12;
}

enum FreezeMode {
  TRY = 0;
  NEVER = 1;
  REQUIRED = 2;
}

message Selection {
  repeated string fields = 1;
  optional int32 tid = 2;
  optional uint32 frames = 3;
}

message SnapshotRequest {
  int32 pid = 1;
  FreezeMode freeze = 2;
  Selection selection = 3;
  optional string run_id = 4;
}

message QuerySnapshotRequest {
  string snapshot_id = 1;
  Selection selection = 2;
  optional uint64 event_id = 3;
}

message SnapshotReply {
  string snapshot_id = 1;
  // The snapshot payload is also the document exported and saved by the CLI.
  bytes snapshot_json = 2;
}

enum CoreMode {
  CORE_STACK = 0;
  CORE_LITE = 1;
  CORE_STACK_4K = 2;
  CORE_STANDARD = 3;
  CORE_EXTENDED = 4;
  CORE_FULL = 5;
}

message CoredumpRequest {
  int32 pid = 1;
  CoreMode mode = 2;
  optional uint32 timeout_ms = 3;
  optional uint32 buffer_mib = 4;
  optional uint32 block_kib = 5;
  optional string run_id = 6;
}

message CoredumpChunk {
  oneof part {
    bytes data = 1;
    bytes summary_json = 2;
  }
}

message StartCoredumpRequest {
  // A client-generated ID makes StartCoredump retries idempotent during retention.
  string dump_id = 1;
  CoredumpRequest capture = 2;
}

message GetCoredumpRequest {
  string dump_id = 1;
}

enum CoredumpJobState {
  COREDUMP_PENDING = 0;
  COREDUMP_READY = 1;
  COREDUMP_FAILED = 2;
}

message CoredumpJob {
  string dump_id = 1;
  CoredumpJobState state = 2;
  uint64 compressed_bytes = 3;
  bytes sha256 = 4;
  bytes summary_json = 5;
  uint64 expires_unix_secs = 6;
  string error = 7;
}

message DownloadCoredumpRequest {
  string dump_id = 1;
  uint64 offset = 2;
}

message DocumentReply {
  bytes json = 1;
}

enum CaptureScope {
  THREAD = 0;
  PROCESS = 1;
}

message SymbolLocation {
  string module = 1;
  string symbol = 2;
  optional uint64 instance = 3;
  optional uint64 offset = 4;
}

message SourceLocation {
  string file = 1;
  uint64 line = 2;
  optional string module = 3;
  optional uint64 instance = 4;
}

message ModuleOffsetLocation {
  string module = 1;
  uint64 offset = 2;
  optional uint64 instance = 3;
}

enum BreakpointKind {
  HARDWARE = 0;
  SOFTWARE = 1;
  WRITE = 2;
  READ_WRITE = 3;
  READ = 4;
}

message InstallBreakpointRequest {
  int32 pid = 1;
  oneof location {
    uint64 address = 2;
    SymbolLocation symbol = 3;
    SourceLocation source = 13;
    ModuleOffsetLocation module_offset = 14;
  }
  CaptureScope scope = 4;
  optional uint32 timeout_ms = 5;
  BreakpointKind kind = 6;
  optional uint32 length = 7;
  optional string rule_source = 8;
  optional string run_id = 9;
  optional uint64 rule_id = 10;
  optional int32 tid = 11;
  optional string handler = 12;
  optional string replay_export = 15;
  bool stop_after_hit = 16;
}

message RemoveBreakpointRequest {
  int32 pid = 1;
  uint64 breakpoint_id = 2;
  optional string run_id = 3;
}

message UpdateBreakpointRequest {
  uint64 breakpoint_id = 1;
  optional uint64 address = 2;
  optional uint64 rule_id = 3;
}

message BreakpointEventsRequest {
  optional uint64 breakpoint_id = 1;
  uint64 after_event_id = 2;
}

enum SymbolMatch {
  EXACT = 0;
  GLOB = 1;
  REGEX = 2;
}

message SearchSymbolsRequest {
  int32 pid = 1;
  string pattern = 2;
  SymbolMatch match_mode = 3;
  optional string module = 4;
  optional uint32 limit = 5;
  optional string target_id = 6;
  optional string run_id = 7;
}

message ResolveAddressRequest {
  int32 pid = 1;
  uint64 address = 2;
  optional string target_id = 3;
}

message DisassembleRequest {
  int32 pid = 1;
  uint64 address = 2;
  optional uint32 before = 3;
  optional uint32 after = 4;
  optional uint64 start = 5;
  optional string target_id = 6;
  optional string run_id = 7;
}

message SearchMemoryRequest {
  string target_id = 1;
  bytes pattern = 2;
  optional uint64 start = 3;
  optional uint64 end = 4;
  optional uint32 limit = 5;
  optional uint32 max_scan_bytes = 6;
  optional uint32 alignment = 7;
  optional uint64 pointer_value = 8;
  bool instruction_references = 9;
  optional int32 pid = 10;
  optional string run_id = 11;
  optional uint64 resume_from = 12;
}

message PointerChainRequest {
  string target_id = 1;
  uint64 base = 2;
  repeated sint64 offsets = 3;
  optional int32 pid = 4;
  optional string run_id = 5;
}

message BreakpointCapabilitiesRequest {
  optional int32 pid = 1;
  optional string run_id = 2;
}

message ProfileRequest {
  int32 pid = 1;
  bool stack = 2;
  optional uint32 duration_ms = 3;
  optional uint32 frequency_hz = 4;
  optional int32 tid = 5;
}

message SymbolOverrideRequest {
  oneof action {
    SetSymbolOverride set = 1;
    string remove_id = 2;
    bool list = 3;
  }
}

message SetSymbolOverride {
  int32 pid = 1;
  uint64 address = 2;
  uint64 length = 3;
  string name = 4;
}

message InspectRequest {
  int32 pid = 1;
  optional int32 tid = 2;
  string expression = 3;
  optional string module = 4;
  optional uint64 instance = 5;
  optional string run_id = 6;
  optional uint32 timeout_ms = 7;
  InspectExpansion expand = 8;
  optional string target_id = 9;
  optional uint32 frame_index = 10;
  repeated string expressions = 11;
}

message InspectExpansion {
  uint32 offset = 1;
  optional uint32 limit = 2;
}

message AssembleRequest {
  uint64 address = 1;
  string source = 2;
}

message AddressRange {
  uint64 address = 1;
  uint64 length = 2;
}

message PatchRequest {
  uint64 base = 1;
  uint64 address = 2;
  bytes original = 3;
  string source = 4;
  repeated AddressRange existing = 5;
  optional string target_id = 6;
  optional uint32 original_length = 7;
}

message MemoryCopy {
  uint64 address = 1;
  bytes contents = 2;
  bool writable = 3;
}

message ObjectProbe {
  uint64 address = 1;
  uint64 length = 2;
  string name = 3;
  uint32 guard_bytes = 4;
}

message CoreMemoryCopy {
  uint64 address = 1;
  uint32 length = 2;
  bool writable = 3;
  repeated MemoryCopy overlays = 4;
}

message EmulateRequest {
  uint64 address = 1;
  bytes code = 2;
  map<string, uint64> registers = 3;
  repeated MemoryCopy memory = 4;
  repeated AddressRange watch = 5;
  repeated ObjectProbe objects = 6;
  optional uint32 instruction_limit = 7;
  optional uint32 timeout_ms = 8;
  optional string target_id = 9;
  optional string frame = 10;
  optional uint32 code_length = 11;
  repeated CoreMemoryCopy core_memory = 12;
}
