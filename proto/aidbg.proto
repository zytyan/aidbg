syntax = "proto3";

package aidbg;

// The session token is carried in aidbg-session metadata on every call.
service Debugger {
  rpc Heartbeat (HeartbeatRequest) returns (ToolReply);
  rpc Run (RunProcessRequest) returns (ToolReply);
  rpc Status (HeartbeatRequest) returns (ToolReply);
  rpc Attach (AttachRequest) returns (ToolReply);
  rpc ScriptRun (RunScriptRequest) returns (ToolReply);
  rpc ScriptWait (WaitScriptRequest) returns (ToolReply);
  rpc CoreOpen (OpenCoreRequest) returns (ToolReply);
  rpc SendInput (SendInputRequest) returns (ToolReply);
  rpc InterruptInput (InterruptInputRequest) returns (ToolReply);
  rpc Snapshot (SessionSnapshotRequest) returns (ToolReply);
  rpc Perf (SessionProfileRequest) returns (ToolReply);
  rpc Ps (ProcessListRequest) returns (ToolReply);
  rpc SetForkPolicy (ForkPolicyRequest) returns (ToolReply);
  rpc SyscallTable (SyscallTableRequest) returns (ToolReply);
}

message HeartbeatRequest {}
message RunProcessRequest {
  string path = 1;
  repeated string arg = 2;
  bool pause = 3;
}
message AttachRequest { int32 pid = 1; bool pause = 2; }
message RunScriptRequest {
  string src = 1;
  uint32 wait_ms = 2;
  RunProcessRequest run = 3;
}
message WaitScriptRequest { uint64 script_id = 1; uint32 wait_ms = 2; }
message OpenCoreRequest {
  string path = 1;
  optional string executable = 2;
  optional string debug_symbols = 3;
}
message SendInputRequest {
  string handler = 1;
  string data = 2;
}
message InterruptInputRequest {
  string handler = 1;
  optional string msg = 2;
}
message SessionSnapshotRequest {
  optional int32 tid = 1;
  bool context = 2;
  optional uint32 stop_timeout_ms = 3;
}
message ProcessListRequest {
  bool threads = 1;
  optional string pattern = 2;
  optional uint32 limit = 3;
  uint32 offset = 4;
  repeated string fields = 5;
}
message ForkPolicyRequest { string mode = 1; }
message SyscallTableRequest {
  optional uint64 id = 1;
  optional string name = 2;
}
message SessionProfileRequest {
  int32 pid = 1;
  bool hotspot = 2;
  bool stack = 3;
  optional uint32 duration_ms = 4;
  optional uint32 frequency_hz = 5;
  optional int32 tid = 6;
}

message WaitingInput {
  string handler = 1;
  optional int32 tid = 2;
  bytes payload_json = 3;
}
message ScriptOutput {
  uint64 script_id = 1;
  bytes json = 2;
}
message ToolReply {
  bytes result_json = 1;
  optional string error = 2;
  repeated int32 paused_threads = 3;
  repeated WaitingInput waiting_inputs = 4;
  repeated ScriptOutput script_output = 5;
  bool output_dropped = 6;
  repeated uint64 running_scripts = 7;
  optional string target_error = 8;
  bytes waiting_events_json = 9;
  bytes signals_json = 10;
  uint32 pending_events = 11;
  bool event_queue_full = 12;
  bytes process_output_json = 13;
  bytes paused_stops_json = 14;
}
