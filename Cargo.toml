[package]
name = "aidbg"
version = "0.7.3"
edition = "2024"
rust-version = "1.100"
default-run = "aidbg"

[features]
# Some AArch64 Linux kernels expose a smaller userspace virtual address range
# than the fixed address required by tsrs pointer compression.
plain-ptrs = ["tsrs_core/plain-ptrs"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
sha2 = "=0.11.1"

clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
object = { version = "=0.41.0", default-features = false, features = ["elf", "read_core", "std", "compression"] }
gimli = { version = "=0.34.0", default-features = false, features = ["read-all"] }
nix = { version = "=0.31.2", features = ["fs", "ptrace", "signal", "uio"] }
num-bigint = "=0.5.1"
cpp_demangle = "=0.6.0"
capstone = { version = "=0.14.0", default-features = false, features = ["std", "full", "arch_x86", "arch_arm64"] }
crc32fast = "1"
glob = "0.3"
regex = "1"
rquickjs = { version = "=0.12.2", features = ["loader"] }
tsrs_api = "=7.1.0-beta.tsrs4"
tsrs_ast = "=7.1.0-beta.tsrs4"
tsrs_core = "=7.1.0-beta.tsrs4"
tsrs_project = "=7.1.0-beta.tsrs4"
tsrs_scanner = "=7.1.0-beta.tsrs4"
tsrs_vfs = "=7.1.0-beta.tsrs4"
zstd = { version = "=0.13.3", default-features = false }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
