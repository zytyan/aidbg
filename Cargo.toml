[package]
name = "aidbg"
version = "0.1.0"
edition = "2024"
default-run = "aidbg"

[dependencies]
object = { version = "=0.41.0", default-features = false, features = ["elf", "read_core", "std", "compression"] }
gimli = { version = "=0.34.0", default-features = false, features = ["read-all"] }
nix = { version = "=0.31.2", features = ["ptrace", "uio"] }
cpp_demangle = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
